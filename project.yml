name: Checklead
options:
  bundleIdPrefix: com.checklead
  deploymentTarget:
    iOS: "17.0"
    watchOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Checklead:
    type: application
    platform: iOS
    sources:
      - path: Checklead
    dependencies:
      - target: CheckleadWatch
        embed: true
      - target: Alamofire
        embed: false
    resources:
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checklead.rail
        PRODUCT_NAME: Checklead
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_CFBundleDisplayName: Stakiz
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSCameraUsageDescription: "Checklead reads the code on a pet collar tag so today's chores lock onto that animal."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  Alamofire:
    type: framework
    platform: iOS
    sources:
      - path: Vendor/Alamofire/Source
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checklead.rail.alamofire
        PRODUCT_NAME: Alamofire
        PRODUCT_MODULE_NAME: Alamofire
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
  CheckleadWatch:
    type: application
    platform: watchOS
    sources:
      - path: Checklead/ReviewLaunch.swift
      - path: CheckleadWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checklead.rail.watchkitapp
        PRODUCT_NAME: CheckleadWatch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Stakiz
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.checklead.rail
        WATCHOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
  CheckleadTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CheckleadTests
    dependencies:
      - target: Checklead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.checklead.rail.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SWIFT_VERSION: "6.2"
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Checklead.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Checklead"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic
schemes:
  Checklead:
    build:
      targets:
        Checklead: all
        Alamofire: all
        CheckleadTests: [test]
    test:
      targets:
        - CheckleadTests
  CheckleadWatch:
    build:
      targets:
        CheckleadWatch: all
